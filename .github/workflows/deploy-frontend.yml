name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-mtd-frontend
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  APP_DIR: /var/www/mtd/frontend
  PM2_NAME: mtd-frontend

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build (CI verification)
        env:
          # Public build-time vars only. Server deploy uses the existing .env on Hetzner.
          NEXT_PUBLIC_APP_NAME: My Tax Diary
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://app.mytaxdiary.co.uk/api/v1
        run: npm run build

  deploy:
    name: Deploy to Hetzner
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail

            echo "==> Deploying frontend to ${{ env.APP_DIR }}"
            cd "${{ env.APP_DIR }}"

            if [ "$(id -u)" -eq 0 ]; then
              echo "ERROR: Refusing to deploy as root. Use a non-root deploy user."
              exit 1
            fi

            echo "==> Fetching latest main"
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main

            echo "==> Installing dependencies"
            npm ci

            echo "==> Removing previous Next.js build output"
            rm -rf .next

            echo "==> Building Next.js production bundle"
            npm run build

            echo "==> Restarting PM2 process ${{ env.PM2_NAME }}"
            pm2 restart "${{ env.PM2_NAME }}" --update-env
            pm2 save

            echo "==> Health check on http://localhost:3000"
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 10 "http://localhost:3000" >/dev/null; then
                echo "Frontend health check passed."
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done

            echo "ERROR: Frontend did not respond on http://localhost:3000 after deploy."
            exit 1
